name: Commit Patch to 7z

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git p7zip-full
      
      - name: Generate patch and compress
        run: |
          set -e
      
          OWNER="Wumpus-Central"
          REPO="discrapper-canary"
          SHA="${{ github.event.inputs.sha }}"
      
          URL="https://github.com/${OWNER}/${REPO}.git"
          TMP_DIR=$(mktemp -d)
      
          echo "Target commit: $SHA"
      
          git init "$TMP_DIR"
          cd "$TMP_DIR"
      
          git remote add origin "$URL"
      
          # pull ONLY last 4 commits (lightweight)
          git fetch --depth 4 origin main
      
          # make sure SHA exists in fetched history
          git cat-file -e "$SHA^{commit}" || {
            echo "Commit not in last 4 commits, fetching it directly..."
            git fetch --depth 1 origin "$SHA"
          }
      
          # checkout exact commit
          git checkout --detach "$SHA"
      
          echo "Generating patch..."
      
          git format-patch -1 HEAD --stdout > patch.patch
      
          echo "Compressing..."
      
          7z a commit_patch.7z patch.patch
      
          mv commit_patch.7z "$GITHUB_WORKSPACE/"

      - name: Create GitHub Release + upload asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: commit-${{ github.event.inputs.sha }}
          name: "Commit ${{ github.event.inputs.sha }}"
          files: |
            *.7z
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
