name: Commit Patch to gz

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git gzip

      - name: Generate GitHub-identical patch
        run: |
          set -e

          OWNER="Wumpus-Central"
          REPO="discrapper-canary"
          SHA="${{ github.event.inputs.sha }}"
          URL="https://github.com/${OWNER}/${REPO}.git"

          TMP_DIR=$(mktemp -d)
          cd "$TMP_DIR"

          echo "Cloning minimal repo..."

          git init
          git remote add origin "$URL"

          git fetch --depth=20 origin "$SHA"

          echo "Checking out commit..."
          git checkout --detach "$SHA"

          echo "Verifying commit exists..."
          git cat-file -e "$SHA^{commit}"

          echo "Generating GitHub-equivalent patch..."

          git show "$SHA" --pretty=email --patch > patch.patch

          echo "Compressing with gzip (max level)..."
          gzip --best patch.patch

          mv patch.patch.gz "$GITHUB_WORKSPACE/"

      - name: Create GitHub Release + upload asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: commit-${{ github.event.inputs.sha }}
          name: "Commit ${{ github.event.inputs.sha }}"
          files: |
            *.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
